// Kea DHCPv4 configuration. Adjust interface, subnet and options to your network.
// Reference: https://kea.readthedocs.io/en/latest/arm/dhcp4-srv.html
{
  "Dhcp4": {
    "interfaces-config": {
      // Must match the interface configured in
      // /etc/NetworkManager/system-connections/dhcp-lan.nmconnection
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "raw",
      "service-sockets-require-all": true,
      "service-sockets-max-retries": 60,
      "service-sockets-retry-wait-time": 2000
    },

    "control-socket": {
      "socket-type": "unix",
      "socket-name": "/var/run/kea/kea4-ctrl-socket"
    },

    // Leases live in /var, which bootc preserves across image updates.
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/kea-leases4.csv",
      "lfc-interval": 3600
    },

    "expired-leases-processing": {
      "reclaim-timer-wait-time": 10,
      "flush-reclaimed-timer-wait-time": 25,
      "hold-reclaimed-time": 3600,
      "max-reclaim-leases": 100,
      "max-reclaim-time": 250,
      "unwarned-reclaim-cycles": 5
    },

    "valid-lifetime": 7200,
    "renew-timer": 1800,
    "rebind-timer": 3600,

    "authoritative": true,

    "option-data": [
      { "name": "domain-name-servers", "data": "192.168.100.1" },
      { "name": "domain-name", "data": "lan.example" },
      { "name": "domain-search", "data": "lan.example" }
    ],

    "subnet4": [
      {
        "id": 1,
        "subnet": "192.168.100.0/24",
        "pools": [ { "pool": "192.168.100.100 - 192.168.100.200" } ],
        "option-data": [
          { "name": "routers", "data": "192.168.100.1" }
        ],
        "reservations": [
          // { "hw-address": "aa:bb:cc:dd:ee:ff", "ip-address": "192.168.100.10", "hostname": "printer" }
        ]
      }
    ],

    "loggers": [
      {
        "name": "kea-dhcp4",
        // stdout -> journald (journalctl -u kea-dhcp4)
        "output-options": [ { "output": "stdout", "pattern": "%-5p %m\n" } ],
        "severity": "INFO",
        "debuglevel": 0
      }
    ]
  }
}
